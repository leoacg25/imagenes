<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Imagen</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #2d3748;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px 32px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        /* Área de drop / preview */
        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--accent);
            background: #eef2ff;
        }

        .drop-zone.has-image {
            padding: 12px;
            border-style: solid;
            border-color: #d1d5db;
            background: #fff;
        }

        .drop-zone img {
            max-width: 100%;
            max-height: 320px;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        .drop-zone .placeholder {
            color: #94a3b8;
            font-size: 0.95rem;
            pointer-events: none;
        }

        .drop-zone .placeholder span {
            display: block;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        /* Botones */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }

        .btn-primary:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-outline {
            background: #fff;
            color: var(--accent);
            border: 2px solid var(--accent);
            margin-top: 10px;
        }

        .btn-outline:hover {
            background: #eef2ff;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            margin-top: 10px;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
        }

        .btn-danger:disabled {
            background: #fca5a5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hidden {
            display: none !important;
        }

        .success-msg {
            margin-top: 16px;
            color: #16a34a;
            font-weight: 600;
            font-size: 0.9rem;
            animation: fadeIn 0.4s ease;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-info {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-circle">📤</div>
        <h1>Cargar Imagen</h1>
        <p class="subtitle">Selecciona o arrastra una imagen para guardarla</p>

        <!-- Zona de drop -->
        <div class="drop-zone" id="dropZone">
            <div class="placeholder" id="placeholder">
                <span>📁 Arrastra tu imagen aquí</span>
                o haz clic para seleccionar
            </div>
            <img id="previewImg" class="hidden" alt="Vista previa">
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <p class="file-info" id="fileInfo"></p>

        <div class="button-group">
            <button class="btn btn-primary" id="saveBtn" disabled>
                💾 Guardar y ver imagen
            </button>
            
            <button class="btn btn-outline" id="viewBtn">
                👁️ Ir a ver imagen guardada
            </button>

            <button class="btn btn-danger" id="deleteBtn">
                🗑️ Borrar imagen
            </button>
        </div>

        <p class="success-msg hidden" id="successMsg">✅ ¡Imagen guardada correctamente!</p>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const placeholder = document.getElementById('placeholder');
        const saveBtn = document.getElementById('saveBtn');
        const viewBtn = document.getElementById('viewBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const fileInfo = document.getElementById('fileInfo');
        const successMsg = document.getElementById('successMsg');

        let selectedFile = null;

        // --- Click en drop zone ---
        dropZone.addEventListener('click', () => fileInput.click());

        // --- Drag & Drop ---
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        // --- Input file change ---
        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            selectedFile = file;

            // Mostrar preview
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewImg.classList.remove('hidden');
                placeholder.classList.add('hidden');
                dropZone.classList.add('has-image');
            };
            reader.readAsDataURL(file);

            // Info del archivo
            const sizeKB = (file.size / 1024).toFixed(1);
            fileInfo.textContent = `📎 ${file.name} — ${sizeKB} KB`;
            saveBtn.disabled = false;
            successMsg.classList.add('hidden');
            deleteBtn.disabled = false;
        }

        // --- Guardar en localStorage ---
        saveBtn.addEventListener('click', () => {
            if (!selectedFile) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                localStorage.setItem('imagenGuardada', e.target.result);
                localStorage.setItem('imagenNombre', selectedFile.name);

                successMsg.classList.remove('hidden');
                saveBtn.disabled = true;

                // Redirigir después de 1 segundo
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            };
            reader.readAsDataURL(selectedFile);
        });

        // --- Borrar imagen ---
        deleteBtn.addEventListener('click', () => {
            // Limpiar localStorage
            localStorage.removeItem('imagenGuardada');
            localStorage.removeItem('imagenNombre');
            
            // Limpiar UI
            previewImg.src = '';
            previewImg.classList.add('hidden');
            placeholder.classList.remove('hidden');
            dropZone.classList.remove('has-image');
            fileInfo.textContent = '';
            selectedFile = null;
            saveBtn.disabled = true;
            successMsg.classList.add('hidden');
            deleteBtn.disabled = true;
            
            // Resetear input file
            fileInput.value = '';
        });

        // --- Ir a ver imagen ---
        viewBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        // --- Cargar preview si ya hay imagen en localStorage al volver ---
        (function() {
            const saved = localStorage.getItem('imagenGuardada');
            const savedName = localStorage.getItem('imagenNombre');
            if (saved) {
                previewImg.src = saved;
                previewImg.classList.remove('hidden');
                placeholder.classList.add('hidden');
                dropZone.classList.add('has-image');
                fileInfo.textContent = savedName ? `📎 ${savedName} (guardada)` : '📎 Imagen guardada en memoria';
                saveBtn.disabled = true;
                deleteBtn.disabled = false;
            }
        })();
    </script>

</body>
</html>
