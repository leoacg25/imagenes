<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Imagen</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #2d3748;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --border: #e2e8f0;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 40px 32px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .icon-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #eef2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--text);
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        /* Área de drop / preview */
        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #f8fafc;
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: var(--accent);
            background: #eef2ff;
        }

        .drop-zone.has-image {
            padding: 12px;
            border-style: solid;
            border-color: #d1d5db;
            background: #fff;
        }

        .drop-zone img {
            max-width: 100%;
            max-height: 320px;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
            object-fit: contain;
        }

        .drop-zone .placeholder {
            color: #94a3b8;
            font-size: 0.95rem;
            pointer-events: none;
        }

        .drop-zone .placeholder span {
            display: block;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
        }

        .drop-zone input[type="file"] {
            display: none;
        }

        /* Botones */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
        }

        .btn-primary:disabled {
            background: #a5b4fc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-outline {
            background: #fff;
            color: var(--accent);
            border: 2px solid var(--accent);
            margin-top: 10px;
        }

        .btn-outline:hover {
            background: #eef2ff;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
            margin-top: 10px;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(220, 38, 38, 0.35);
        }

        .btn-danger:disabled {
            background: #fca5a5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .hidden {
            display: none !important;
        }

        .success-msg {
            margin-top: 16px;
            color: #16a34a;
            font-weight: 600;
            font-size: 0.9rem;
            animation: fadeIn 0.4s ease;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .file-info {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon-circle">📤</div>
        <h1>Cargar Imagen</h1>
        <p class="subtitle">Selecciona o arrastra una imagen para guardarla</p>

        <!-- Zona de drop -->
        <div class="drop-zone" id="dropZone">
            <div class="placeholder" id="placeholder">
                <span>📁 Arrastra tu imagen aquí</span>
                o haz clic para seleccionar
            </div>
            <img id="previewImg" class="hidden" alt="Vista previa">
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <p class="file-info" id="fileInfo"></p>

        <div class="button-group">
            <button class="btn btn-primary" id="saveBtn" disabled>
                💾 Guardar y ver imagen
            </button>
            
            <button class="btn btn-outline" id="viewBtn">
                👁️ Ir a ver imagen guardada
            </button>

            <button class="btn btn-danger" id="deleteBtn">
                🗑️ Borrar imagen
            </button>
        </div>

        <p class="success-msg hidden" id="successMsg">✅ ¡Imagen guardada correctamente!</p>

        <div id="configPanel" class="hidden" style="margin-top:20px;padding:20px;background:#f8fafc;border-radius:12px;border:1px solid var(--border);text-align:left;">
            <h3 style="font-size:1rem;margin-bottom:12px;color:var(--text);">🔧 Configurar GitHub</h3>
            <input id="cfgToken" type="password" placeholder="Token de GitHub" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:0.9rem;">
            <input id="cfgOwner" type="text" placeholder="Dueño (ej: leoacg25)" value="leoacg25" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:0.9rem;">
            <input id="cfgRepo" type="text" placeholder="Repositorio (ej: imagenes)" value="imagenes" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:0.9rem;">
            <button id="saveConfigBtn" class="btn btn-primary" style="padding:10px;font-size:0.9rem;">💾 Guardar configuración</button>
            <p id="configSuccess" class="hidden" style="color:#16a34a;font-size:0.8rem;margin-top:8px;">✅ Configuración guardada</p>
        </div>

        <p class="success-msg hidden" id="configMsg" style="color:#dc2626;margin-top:16px;">
            ⚠️ Configura tu token de GitHub para poder subir imágenes
            <br><button id="showConfigBtn" class="btn btn-outline" style="margin-top:8px;padding:8px 16px;font-size:0.85rem;width:auto;">⚙️ Configurar</button>
        </p>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewImg = document.getElementById('previewImg');
        const placeholder = document.getElementById('placeholder');
        const saveBtn = document.getElementById('saveBtn');
        const viewBtn = document.getElementById('viewBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const fileInfo = document.getElementById('fileInfo');
        const successMsg = document.getElementById('successMsg');
        const configMsg = document.getElementById('configMsg');
        const configPanel = document.getElementById('configPanel');
        const showConfigBtn = document.getElementById('showConfigBtn');
        const saveConfigBtn = document.getElementById('saveConfigBtn');
        const cfgToken = document.getElementById('cfgToken');
        const cfgOwner = document.getElementById('cfgOwner');
        const cfgRepo = document.getElementById('cfgRepo');
        const configSuccess = document.getElementById('configSuccess');

        let selectedFile = null;

        function getConfig() {
            return {
                token: localStorage.getItem('gh_token') || '',
                owner: localStorage.getItem('gh_owner') || 'leoacg25',
                repo: localStorage.getItem('gh_repo') || 'imagenes',
                branch: 'main'
            };
        }

        function checkConfig() {
            const cfg = getConfig();
            if (!cfg.token) {
                configMsg.classList.remove('hidden');
                configPanel.classList.add('hidden');
                dropZone.style.pointerEvents = 'none';
                dropZone.style.opacity = '0.5';
                saveBtn.disabled = true;
                return false;
            }
            configMsg.classList.add('hidden');
            configPanel.classList.add('hidden');
            dropZone.style.pointerEvents = '';
            dropZone.style.opacity = '';
            return true;
        }

        showConfigBtn.addEventListener('click', () => {
            const cfg = getConfig();
            cfgToken.value = cfg.token;
            cfgOwner.value = cfg.owner;
            cfgRepo.value = cfg.repo;
            configPanel.classList.remove('hidden');
            configMsg.classList.add('hidden');
            configSuccess.classList.add('hidden');
        });

        saveConfigBtn.addEventListener('click', () => {
            localStorage.setItem('gh_token', cfgToken.value);
            localStorage.setItem('gh_owner', cfgOwner.value);
            localStorage.setItem('gh_repo', cfgRepo.value);
            configSuccess.classList.remove('hidden');
            setTimeout(() => {
                configPanel.classList.add('hidden');
                checkConfig();
            }, 1000);
        });
            configMsg.classList.add('hidden');
            dropZone.style.pointerEvents = '';
            dropZone.style.opacity = '';
            return true;
        }

        dropZone.addEventListener('click', () => {
            if (checkConfig()) fileInput.click();
        });

        dropZone.addEventListener('dragover', (e) => {
            if (!checkConfig()) return;
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            if (!checkConfig()) return;
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                handleFile(file);
            }
        });

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (file) handleFile(file);
        });

        function handleFile(file) {
            selectedFile = file;

            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewImg.classList.remove('hidden');
                placeholder.classList.add('hidden');
                dropZone.classList.add('has-image');
            };
            reader.readAsDataURL(file);

            const sizeKB = (file.size / 1024).toFixed(1);
            fileInfo.textContent = `📎 ${file.name} — ${sizeKB} KB`;
            saveBtn.disabled = false;
            successMsg.classList.add('hidden');
            deleteBtn.disabled = false;
        }

        const channel = new BroadcastChannel('imagenes_channel');

        async function uploadToGitHub(file) {
            const cfg = getConfig();
            const content = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });

            const fileName = `${Date.now()}_${file.name}`;
            const path = `images/${fileName}`;

            const response = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${cfg.token}`,
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: `Add image ${fileName}`,
                    content: content,
                    branch: cfg.branch
                })
            });

            if (!response.ok) {
                const err = await response.json();
                throw new Error(err.message || 'Error al subir la imagen');
            }

            const data = await response.json();
            return { url: data.content.download_url, nombre: file.name };
        }

        saveBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            saveBtn.disabled = true;
            saveBtn.textContent = '⏫ Subiendo a GitHub...';

            try {
                const { url, nombre } = await uploadToGitHub(selectedFile);

                localStorage.setItem('imagenGuardada', url);
                localStorage.setItem('imagenNombre', nombre);

                channel.postMessage({ type: 'imagen', data: url, nombre });

                successMsg.textContent = '✅ ¡Imagen subida a GitHub!';
                successMsg.classList.remove('hidden');
                saveBtn.textContent = '💾 Guardar y ver imagen';
                deleteBtn.disabled = false;
            } catch (error) {
                alert('Error: ' + error.message);
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 Guardar y ver imagen';
            }
        });

        deleteBtn.addEventListener('click', () => {
            previewImg.src = '';
            previewImg.classList.add('hidden');
            placeholder.classList.remove('hidden');
            dropZone.classList.remove('has-image');
            fileInfo.textContent = '';
            selectedFile = null;
            saveBtn.disabled = true;
            successMsg.classList.add('hidden');
            deleteBtn.disabled = true;
            fileInput.value = '';

            localStorage.removeItem('imagenGuardada');
            localStorage.removeItem('imagenNombre');

            channel.postMessage({ type: 'delete' });
        });

        viewBtn.addEventListener('click', () => {
            window.location.href = 'index.html';
        });

        (function() {
            const saved = localStorage.getItem('imagenGuardada');
            const savedName = localStorage.getItem('imagenNombre');
            if (saved) {
                previewImg.src = saved;
                previewImg.classList.remove('hidden');
                placeholder.classList.add('hidden');
                dropZone.classList.add('has-image');
                fileInfo.textContent = savedName ? `📎 ${savedName} (guardada)` : '📎 Imagen guardada';
                saveBtn.disabled = true;
                deleteBtn.disabled = false;
            }
        })();

        checkConfig();
    </script>

</body>
</html>
